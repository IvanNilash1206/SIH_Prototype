<div class="dashboard-container">
    <!-- Stat Cards Row -->
    <div class="grid-4 mb-24">
        <div class="card glass-panel stat-card">
            <div class="stat-icon" style="color: var(--primary)"><i class="ph ph-trend-up"></i></div>
            <div class="stat-content">
                <div class="stat-label">Overall Progress</div>
                <div class="stat-value" id="dash-progress">--%</div>
            </div>
        </div>
        <div class="card glass-panel stat-card">
            <div class="stat-icon" style="color: var(--accent)"><i class="ph ph-check-circle"></i></div>
            <div class="stat-content">
                <div class="stat-label">Activities Completed</div>
                <div class="stat-value" id="dash-completed">--</div>
            </div>
        </div>
        <div class="card glass-panel stat-card">
            <div class="stat-icon" style="color: var(--warning)"><i class="ph ph-clock"></i></div>
            <div class="stat-content">
                <div class="stat-label">Activities In Progress</div>
                <div class="stat-value" id="dash-in-progress">--</div>
            </div>
        </div>
        <div class="card glass-panel stat-card">
            <div class="stat-icon" style="color: var(--danger)"><i class="ph ph-warning-circle"></i></div>
            <div class="stat-content">
                <div class="stat-label">Delayed Activities</div>
                <div class="stat-value" id="dash-delayed">--</div>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="grid-2">
        <!-- Schedule Overview (Gantt-like list) -->
        <div class="card glass-panel">
            <div class="card-header flex-between mb-16">
                <h3 class="card-title"><i class="ph ph-list-numbers"></i> Critical Path Schedule</h3>
                <button class="icon-btn"><i class="ph ph-arrows-out-simple"></i></button>
            </div>
            <div class="schedule-list" id="dash-schedule-list">
                <div class="loading-state-small">
                    <div class="spinner" style="width:20px;height:20px;border-width:2px;"></div>
                </div>
            </div>
        </div>

        <!-- System Alerts / Recent Activity -->
        <div class="card glass-panel">
            <div class="card-header mb-16">
                <h3 class="card-title"><i class="ph ph-activity"></i> Recent Activity Stream</h3>
            </div>
            <div class="activity-stream" id="dash-activity-stream">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>
</div>

}
